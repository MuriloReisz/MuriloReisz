# Builds every moving part of the profile README into this repo's `output`
# branch: the contribution snake, and the stats/language cards.
#
# Self-hosted on purpose. The README first used capsule-render,
# github-readme-stats, streak-stats and github-profile-trophy — free Vercel
# apps shared across hundreds of thousands of profiles. All four rendered as
# blank boxes, because they rate-limit, and there is no fixing someone else's
# quota. Nothing here depends on a third party at display time.
name: Build profile assets

on:
  schedule:
    # 04:12 daily, off the hour so it is not queued behind everyone else's cron.
    - cron: "12 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Snake first: it creates dist/, and the cards are added alongside.
      - name: Render the contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Violet ramp matching muriloreisz.com.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22,%234c3fb5,%236d5ef0,%238b7cf5,%23c4b5fd
            dist/snake.svg?color_snake=%23a78bfa&color_dots=%23ede9fe,%23c4b5fd,%238b7cf5,%236d5ef0,%234c3fb5

      - name: Render the stats and language cards
        env:
          # Needs read:user for the contributions graph; the default token has
          # it for the repo owner's own profile.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        # Output is mirrored into the step summary because Actions log
        # downloads are blocked from the machine this is maintained on, and a
        # failing generator is otherwise undiagnosable.
        # This step NEVER fails, and its output is written into dist/ so it
        # travels to the output branch. Actions log downloads are blocked by
        # the network policy on the machine this is maintained from, so the
        # published branch is the only channel where a traceback is readable.
        # Failing here would also drop the snake and the banner, which are fine.
        run: |
          mkdir -p dist
          set +e
          python3 -u .github/scripts/gen_cards.py 2>&1 | tee dist/build.log
          echo "exit=${PIPESTATUS[0]}" >> dist/build.log
          python3 -V >> dist/build.log
          exit 0

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
