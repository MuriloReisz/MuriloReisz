# Keeps the README's ~/latest block in sync with the Cork AI Consulting blog.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this cannot
# loop with assets.yml.
name: Update blog feed

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/update_feed.py
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "feed: latest Cork AI posts"
          git push
