# Generates the animated contribution snake into the `output` branch of this
# same repo, and the README points at raw.githubusercontent for it.
#
# Self-hosted on purpose: every other animated widget in the README is a free
# third-party service that can rate-limit or disappear, and a broken image on
# a profile looks worse than no image. This one only depends on GitHub.
name: Generate contribution snake

on:
  schedule:
    # 04:12 daily — off the hour, so it is not queued behind everyone else's cron.
    - cron: "12 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Render the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Violet ramp matching muriloreisz.com (--color-primary #6d5ef0,
          # --color-primary-on-dark #a78bfa).
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22,%234c3fb5,%236d5ef0,%238b7cf5,%23c4b5fd
            dist/snake.svg?color_snake=%23a78bfa&color_dots=%23ede9fe,%23c4b5fd,%238b7cf5,%236d5ef0,%234c3fb5

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
