<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Now: building AI agents, running Cork AI Consulting, hosting the Cork AI Meetup, writing the Cork AI blog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#0a1a33"/></linearGradient>
    <style>
      .in { }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .in,.blink { animation: none; opacity: 1; } }
    </style>
  </defs>
  <rect width="580" height="250" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="579" height="249" rx="14" fill="none" stroke="#2997ff" stroke-opacity="0.25"/>
  <text x="32" y="40" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#2997ff" letter-spacing="2">$ tail -f now.log</text>
  
  <g class="in" style="animation-delay:0.2s">
    <text x="32" y="84" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2997ff" letter-spacing="1.5">[BUILDING]</text>
    <text x="150" y="84" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#f5f5f7">AI agents that do real back-office work</text>
  </g>
  <g class="in" style="animation-delay:0.65s">
    <text x="32" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2997ff" letter-spacing="1.5">[RUNNING]</text>
    <text x="150" y="120" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#f5f5f7">Cork AI Consulting with Douglas Woollam</text>
  </g>
  <g class="in" style="animation-delay:1.1s">
    <text x="32" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2997ff" letter-spacing="1.5">[HOSTING]</text>
    <text x="150" y="156" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#f5f5f7">Cork AI Meetup — free, monthly</text>
  </g>
  <g class="in" style="animation-delay:1.55s">
    <text x="32" y="192" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#2997ff" letter-spacing="1.5">[WRITING]</text>
    <text x="150" y="192" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#f5f5f7">the Cork AI blog, for local SMEs</text>
  </g>
  <rect class="blink" x="32" y="218" width="10" height="16" fill="#2997ff"/>
</svg>
