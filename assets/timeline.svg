<?xml version="1.0" encoding="UTF-8"?>
<!-- Career timeline; facts from the vault's murilo-career-facts note. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Career: IT Assistant, Data Analyst at Porto, Freelance engineer, Data Analyst at Apple, Co-Founder of Cork AI Consulting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#0a1a33"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0066cc" stop-opacity="0.6"/><stop offset="1" stop-color="#2997ff"/></linearGradient>
    <style>
      .run { animation: run 4s ease-in-out infinite; }
      .pop  { }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 2s ease-out infinite; }
      @keyframes run { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(960px); opacity: 0; } }
      @keyframes pop  { from { opacity: 0; } }
      @keyframes ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.6); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .run,.ring { animation: none; } .run { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="14" fill="none" stroke="#2997ff" stroke-opacity="0.25"/>
  <text x="40" y="40" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#2997ff" letter-spacing="2">$ git log --career --oneline</text>
  <line x1="120" y1="120" x2="1080" y2="120" stroke="url(#line)" stroke-width="3"/>
  <g class="run"><ellipse cx="120" cy="120" rx="34" ry="4" fill="#9cc9ff" opacity=".7"/></g>
  
  <g class="pop" style="animation-delay:0.3s">
    
    <circle cx="120" cy="120" r="7" fill="#050a14" stroke="#2997ff" stroke-width="2"/>
    <text x="120" y="88" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#8b949e" letter-spacing="1">2021–22</text>
    <text x="120" y="160" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">IT Assistant</text>
    <text x="120" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Marcelo Tostes Advogados</text>
  </g>
  <g class="pop" style="animation-delay:0.6499999999999999s">
    
    <circle cx="360" cy="120" r="7" fill="#050a14" stroke="#2997ff" stroke-width="2"/>
    <text x="360" y="88" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#8b949e" letter-spacing="1">2022–24</text>
    <text x="360" y="160" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">Data Analyst</text>
    <text x="360" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Porto · São Paulo</text>
  </g>
  <g class="pop" style="animation-delay:1.0s">
    
    <circle cx="600" cy="120" r="7" fill="#050a14" stroke="#2997ff" stroke-width="2"/>
    <text x="600" y="88" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#8b949e" letter-spacing="1">2024–26</text>
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">Freelance</text>
    <text x="600" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Data &amp; Automation Engineer</text>
  </g>
  <g class="pop" style="animation-delay:1.3499999999999999s">
    
    <circle cx="840" cy="120" r="7" fill="#050a14" stroke="#2997ff" stroke-width="2"/>
    <text x="840" y="88" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#8b949e" letter-spacing="1">2025–26</text>
    <text x="840" y="160" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">Data Analyst</text>
    <text x="840" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Apple · EMEIA Sales BPR</text>
  </g>
  <g class="pop" style="animation-delay:1.7s">
    <circle class="ring" cx="1080" cy="120" r="10" fill="none" stroke="#2997ff" stroke-width="2"/>
    <circle cx="1080" cy="120" r="9" fill="#2997ff" stroke="#2997ff" stroke-width="2"/>
    <text x="1080" y="88" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#2997ff" letter-spacing="1">2026 →</text>
    <text x="1080" y="160" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f5f7">Co-Founder</text>
    <text x="1080" y="182" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11.5" fill="#8b949e">Cork AI Consulting</text>
  </g>
</svg>
