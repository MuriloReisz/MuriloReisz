<svg xmlns="http://www.w3.org/2000/svg" width="480" height="194" viewBox="0 0 480 194" role="img" aria-label="Most used languages">
<title>Most used languages</title>
<defs><style>.b{transform-origin:left center;animation:grow .8s cubic-bezier(.22,1,.36,1) backwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){.b{animation:none}}</style></defs>
<rect width="480" height="194" rx="4" fill="#ffffff" stroke="rgba(0,76,153,0.28)"/>
<text x="24" y="34" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12" fill="#004c99" letter-spacing="2">$ cloc --by-language</text>
<text x="24" y="62" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#0066cc" letter-spacing="1">LANGUAGES</text>
<rect x="24" y="74" width="432" height="1" fill="rgba(0,76,153,0.28)"/>
<text x="24" y="107" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#5f5f68">Python</text>
<text x="456" y="107" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">71.4%</text>
<rect x="24" y="113" width="432" height="6" rx="3" fill="#0066cc" opacity="0.10"/>
<rect class="b" style="animation-delay:0ms" x="24" y="113" width="308.4" height="6" rx="3" fill="#2997ff"/>
<text x="24" y="141" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#5f5f68">TypeScript</text>
<text x="456" y="141" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">15.8%</text>
<rect x="24" y="147" width="432" height="6" rx="3" fill="#0066cc" opacity="0.10"/>
<rect class="b" style="animation-delay:110ms" x="24" y="147" width="68.1" height="6" rx="3" fill="#3d8bfd"/>
<text x="24" y="175" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#5f5f68">Astro</text>
<text x="456" y="175" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">12.8%</text>
<rect x="24" y="181" width="432" height="6" rx="3" fill="#0066cc" opacity="0.10"/>
