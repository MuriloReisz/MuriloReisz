<text x="456" y="141" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#f5f5f7" text-anchor="end">16.1%</text>
<rect x="24" y="147" width="432" height="6" rx="3" fill="#a78bfa" opacity="0.10"/>
