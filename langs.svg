<text x="24" y="107" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" fill="#8a8a90">Python</text>
<text x="456" y="107" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="700" fill="#f5f5f7" text-anchor="end">70.9%</text>
